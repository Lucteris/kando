name: Build Windows x64

on:
  push:
    tags:
      - '**'
  workflow_dispatch: # Allows you to click "Run workflow" manually!

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version-file: .node-version
          
      - name: Install Dependencies
        run: |
          npm install
          
      - name: Create Release
        run: |
          npm run make
          
      - name: Rename Executables
        shell: pwsh
        run: |
          Get-ChildItem -Path out/make/squirrel.windows/*/*.exe | Rename-Item -NewName { $_.BaseName + "-x64" + $_.Extension }
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kando-windows-x64
          path: |
            out/make/zip/win32/*/*
            out/make/squirrel.windows/*/*.exe
          retention-days: 7
